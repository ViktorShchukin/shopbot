#Sat Feb 22 08:50:23 UTC 2025

micronaut.application.name=shopbot

datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.url=${SB_DB_URL}?currentSchema=${SB_DB_DEFAULT_SCHEMA:public}
datasources.default.username=${SB_DB_USERNAME}
datasources.default.password=${SB_DB_PASSWORD}
datasources.default.default-schema=${SB_DB_DEFAULT_SCHEMA:public}
flyway.datasources.default.enabled=true
flyway.datasources.default.default-schema=${SB_DB_DEFAULT_SCHEMA:public}

#micronaut.chatbots.folder=botcommands
#micronaut.chatbots.telegram.bots.example.token=WEBHOOK_TOKEN
#micronaut.chatbots.telegram.bots.example.at-username=@MyMicronautExampleBot

micronaut.server.port=${SB_SERVER_PORT:8080}

micronaut.router.static-resources.html.mapping=/
micronaut.router.static-resources.html.paths=classpath\:static
micronaut.router.static-resources.js.mapping=/elm.js
micronaut.router.static-resources.js.paths=classpath\:static
micronaut.router.static-resources.css.mapping=/*.css
micronaut.router.static-resources.scc.paths=classpath\:static

sb.chatbot.telegram.bot.token=${SB_TELEGRAM_BOT_TOKEN}
